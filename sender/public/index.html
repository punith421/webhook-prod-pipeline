<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Webhook Sender — Production</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#12151a; --line:#1f242c; --text:#d9dee5; --dim:#6b7580;
    --out:#4dd0c4; --ok:#57c785; --err:#e05d5d; --mono:"JetBrains Mono","SFMono-Regular",Consolas,Menlo,monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--mono);display:flex;flex-direction:column;height:100vh;}
  header{padding:16px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px;}
  header h1{font-size:15px;margin:0;text-transform:uppercase;letter-spacing:.06em;}
  header h1 span{color:var(--dim);font-weight:400;text-transform:none;letter-spacing:normal;}
  .conn{font-size:11px;color:var(--dim);display:flex;align-items:center;gap:6px;}
  .dot{width:7px;height:7px;border-radius:50%;background:#3a4048;}
  .dot.live{background:var(--ok);box-shadow:0 0 0 3px rgba(87,199,133,.15);}
  .badge{font-size:10px;padding:2px 8px;border-radius:10px;background:var(--panel);border:1px solid var(--line);color:var(--dim);}
  .badge.on{color:var(--ok);border-color:var(--ok);}
  .controls{padding:14px 24px;border-bottom:1px solid var(--line);display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;background:var(--panel);}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;}
  .field input{background:#0b0d10;border:1px solid var(--line);color:var(--text);font-family:var(--mono);font-size:13px;padding:6px 8px;border-radius:4px;width:210px;}
  .field input:focus{outline:none;border-color:var(--out);}
  .field.narrow input{width:90px;}
  button{font-family:var(--mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:9px 18px;border-radius:4px;border:none;cursor:pointer;background:var(--out);color:#0b0d10;font-weight:700;}
  button:disabled{opacity:.4;cursor:not-allowed;}
  button:hover:not(:disabled){filter:brightness(1.1);}
  .stats{display:flex;border-bottom:1px solid var(--line);}
  .stat{flex:1;padding:12px 24px;border-right:1px solid var(--line);}
  .stat:last-child{border-right:none;}
  .stat .label{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;}
  .stat .value{font-size:22px;font-weight:700;margin-top:2px;}
  main{flex:1;display:flex;min-height:0;}
  .lane{flex:1;display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0;}
  .lane:last-child{border-right:none;}
  .lane h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin:0;padding:10px 20px;border-bottom:1px solid var(--line);background:var(--panel);}
  .lane-body{flex:1;overflow-y:auto;padding:6px 0;}
  .row{display:flex;gap:10px;align-items:center;padding:5px 20px;font-size:12px;border-bottom:1px dashed rgba(255,255,255,.03);animation:in .18s ease-out;}
  @keyframes in{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
  .row .id{color:var(--dim);width:52px;flex-shrink:0;}
  .row .txt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row.ok .txt{color:var(--ok);}
  .row.err .txt{color:var(--err);}
  .row .ms{color:var(--dim);flex-shrink:0;}
  .empty{color:var(--dim);font-size:12px;padding:16px 20px;}
  ::-webkit-scrollbar{width:8px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
</style>
</head>
<body>
<header>
  <h1>Webhook Sender <span>/ production</span></h1>
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="badge" id="signBadge">signing: unknown</span>
    <div class="conn"><span class="dot" id="connDot"></span><span id="connLabel">connecting…</span></div>
  </div>
</header>
<div class="controls">
  <div class="field"><label for="targetUrl">Receiver webhook URL</label><input id="targetUrl" /></div>
  <div class="field"><label for="replyBaseUrl">My reply-webhook base URL</label><input id="replyBaseUrl" /></div>
  <div class="field narrow"><label for="count">Messages</label><input id="count" type="number" min="1" max="1000" value="200" /></div>
  <div class="field narrow"><label for="concurrency">Send concurrency</label><input id="concurrency" type="number" min="1" max="200" value="30" /></div>
  <button id="sendBtn">Send webhook batch</button>
</div>
<div class="stats">
  <div class="stat"><div class="label">Sent</div><div class="value" id="statSent">0</div></div>
  <div class="stat"><div class="label">Replies received</div><div class="value" id="statReplies">0</div></div>
  <div class="stat"><div class="label">Elapsed</div><div class="value" id="statElapsed">0 ms</div></div>
  <div class="stat"><div class="label">Status</div><div class="value" id="statStatus">idle</div></div>
</div>
<main>
  <div class="lane"><h2>Messages sent (HMAC-signed)</h2><div class="lane-body" id="sentLane"><div class="empty">Set a count and click Send.</div></div></div>
  <div class="lane"><h2>Reply webhooks received back</h2><div class="lane-body" id="replyLane"><div class="empty">Replies stream in here.</div></div></div>
</main>
<script src="app.js" defer></script>
</body>
</html>
